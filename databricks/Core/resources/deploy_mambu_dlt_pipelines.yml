resources:
  jobs:
    run_mambu_dlt_pipelines:
      name: ${bundle.target}_run_mambu_dlt_pipelines
      tasks:
        - task_key: bronze_mambu_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_mambu_int.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_mambu_int:
      name: ${bundle.target}_dlt_bronze_mambu_int
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 5
            mode: ENHANCED
      libraries:
        - notebook:
            path: "/Workspace/Repos/notebooks/databricks/src/bronze_merges/Mambu/nb_dlt_bronze_con_data_model.py"
      target: bronze_mambu_int
      channel: PREVIEW
      catalog: ${bundle.target}_catalog
      data_sampling: false
