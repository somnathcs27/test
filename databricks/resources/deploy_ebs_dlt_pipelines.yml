resources:
  jobs:
    run_ebs_dlt_pipelines:
      name: ${bundle.target}_job_run_ebs_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_ebs_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_ebs_con.id}
            full_refresh: false
        - task_key: bronze_ebs_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_ebs_int.id}
            full_refresh: false
        - task_key: silver_ebs_con
          depends_on:
            - task_key: bronze_ebs_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_ebs_con_data_model.id}
            full_refresh: false
        - task_key: silver_ebs_int
          depends_on:
            - task_key: bronze_ebs_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_ebs_int_data_model.id}
            full_refresh: false
        - task_key: gold_ebs_con
          depends_on:
            - task_key: silver_ebs_int
            - task_key: silver_ebs_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_ebs_con_data_model.id}
            full_refresh: false
        - task_key: gold_ebs_int
          depends_on:
            - task_key: silver_ebs_int
            - task_key: silver_ebs_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_ebs_int_data_model.id}
            full_refresh: false
        - task_key: gold_ebs_fact_con
          depends_on:
            - task_key: gold_ebs_con
            - task_key: gold_ebs_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_ebs_fact_con_data_model.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_ebs_con:
      name: ${bundle.target}_dlt_bronze_ebs_con
      tags:
        source: 'ebs'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'ebs'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/ebs/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_ebs_con
      catalog: ${bundle.target}_catalog

    dlt_bronze_ebs_int:
      name: ${bundle.target}_dlt_bronze_ebs_int
      tags:
        source: 'ebs'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'ebs'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/ebs/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_ebs_int
      catalog: ${bundle.target}_catalog

    dlt_silver_ebs_con_data_model:
      name: ${bundle.target}_dlt_silver_ebs_con_data_model
      tags:
        source: 'ebs'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'ebs'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/ebs_data_model/nb_dlt_update_silver_con_ebs_py.py"
      configuration:
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: silver_con
      catalog: ${bundle.target}_catalog

    dlt_silver_ebs_int_data_model:
