      environment:
        dependencies:
          - --no-index --find-links "/Volumes/${bundle.target}_catalog/common_libraries/wheelhouse/" "/Volumes/${bundle.target}_catalog/common_libraries/mdp_databricks_common_${var.common_libs_beta_ver_underscore}/mdp_databricks_common-${var.common_libs_beta_ver}-py3-none-any.whl"
      event_log:
        name: dlt_bronze_mso_int
        schema: event_log
        catalog: ${bundle.target}_logs             

    dlt_silver_mso_con_data_model:
      name: ${bundle.target}_dlt_silver_mso_con_data_model
      serverless: true      
      tags:
        source: 'mso'
        class: 'con'
