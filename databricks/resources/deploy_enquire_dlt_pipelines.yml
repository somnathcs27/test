resources:
  jobs:
    run_enquire_dlt_pipelines:
      name: ${bundle.target}_job_run_enquire_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_enquire_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_enquire_con.id}
            full_refresh: false
        - task_key: bronze_enquire_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_enquire_int.id}
            full_refresh: false  
        - task_key: silver_enquire_con
          depends_on:
            - task_key: bronze_enquire_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_enquire_con_data_model.id}
            full_refresh: false
        - task_key: silver_enquire_int
          depends_on:
            - task_key: bronze_enquire_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_enquire_int_data_model.id}
            full_refresh: false
        - task_key: gold_enquire_con
          depends_on:
            - task_key: silver_enquire_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_enquire_dim_con_data_model.id}
            full_refresh: false
        - task_key: gold_enquire_int
          depends_on:
            - task_key: silver_enquire_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_enquire_dim_int_data_model.id}
            full_refresh: false
        - task_key: gold_enquire_fact_int
          depends_on:
            - task_key: gold_enquire_con
            - task_key: gold_enquire_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_enquire_fact_int_data_model.id}
            full_refresh: false      
      queue:
        enabled: true

  pipelines:
    dlt_bronze_enquire_con:
      name: ${bundle.target}_dlt_bronze_enquire_con
      tags:
        source: 'enquire'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'enquire'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/enquire/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_enquire_con
      catalog: ${bundle.target}_catalog

    dlt_bronze_enquire_int:
      name: ${bundle.target}_dlt_bronze_enquire_int
      tags:
        source: 'enquire'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'enquire'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/enquire/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_enquire_int
      catalog: ${bundle.target}_catalog

    dlt_silver_enquire_con_data_model:
      name: ${bundle.target}_dlt_silver_enquire_con_data_model
      tags:
        source: 'enquire'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'enquire'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/enquire_data_model/nb_dlt_update_silver_con_enquire_py.py"
      target: silver_con
      catalog: ${bundle.target}_catalog

    dlt_silver_enquire_int_data_model:
      name: ${bundle.target}_dlt_silver_enquire_int_data_model
      tags:
        source: 'enquire'
        class: 'int'
      clusters:
