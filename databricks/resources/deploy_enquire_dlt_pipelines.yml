          custom_tags:
            source: 'enquire'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/enquire_data_model/nb_dlt_update_silver_int_enquire_py.py"
      target: silver_int
      catalog: ${bundle.target}_catalog

    dlt_gold_enquire_dim_con_data_model:
      name: ${bundle.target}_dlt_gold_enquire_dim_con_data_model
      tags:
        source: 'enquire'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
