resources:
  jobs:
    run_select_hr_dlt_pipelines:
      name: ${bundle.target}_job_run_select_hr_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_select_hr_sec
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_select_hr_sec.id}
            full_refresh: false
        - task_key: silver_select_hr_sec
          depends_on:
            - task_key: bronze_select_hr_sec
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_select_hr_sec_data_model.id}
            full_refresh: false
        - task_key: gold_select_hr_int
          depends_on:
            - task_key: silver_select_hr_sec
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_select_hr_int_data_model.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_select_hr_sec:
      name: ${bundle.target}_dlt_bronze_select_hr
      tags:
        source: 'select_hr'
        class: 'sec'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'select_hr'
            class: 'sec'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/select_hr/nb_dlt_bronze_sec_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        datalake_name_sec: ${var.DATALAKE_NAME_SEC}
        datalake_name_pub: ${var.DATALAKE_NAME_PUB}
        pipelines.dropInactiveTables: true
      target: bronze_select_hr_sec
      catalog: ${bundle.target}_catalog

    dlt_silver_select_hr_sec_data_model:
      name: ${bundle.target}_dlt_silver_select_hr_sec_data_model
      tags:
        source: 'select_hr_data'
        class: 'sec'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'select_hr_data'
            class: 'sec'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/select_hr_data_model/nb_dlt_update_silver_sec_select_hr_py.py"
      configuration:
        pipelines.dropInactiveTables: true
      target: silver_sec
      catalog: ${bundle.target}_catalog

    dlt_gold_select_hr_int_data_model:
      name: ${bundle.target}_dlt_gold_select_hr_int_data_model
      tags:
        source: 'select_hr'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'select_hr'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/gold_models/select_hr_data_model/nb_dlt_update_gold_int_select_hr_dim_py.py"
      configuration:
        pipelines.dropInactiveTables: true
      target: gold_int
      catalog: ${bundle.target}_catalog