resources:
  jobs:
    run_mambu_dlt_pipelines:
      name: ${bundle.target}_job_run_mambu_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_mambu_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_mambu_con.id}
            full_refresh: false
        - task_key: bronze_mambu_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_mambu_int.id}
            full_refresh: false
        - task_key: silver_mambu_con
          depends_on:
            - task_key: bronze_mambu_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_mambu_con_data_model.id}
            full_refresh: false
        - task_key: silver_mambu_int
          depends_on:
            - task_key: bronze_mambu_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_mambu_int_data_model.id}
            full_refresh: false
        - task_key: silver_mambu_transformed
          depends_on:
            - task_key: silver_mambu_int
            - task_key: silver_mambu_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_mambu_transformed_data_model.id}
            full_refresh: false
        - task_key: gold_mambu_con
          depends_on:
            - task_key: silver_mambu_int
            - task_key: silver_mambu_con
            - task_key: silver_mambu_transformed
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_mambu_con_data_model.id}
            full_refresh: false
        - task_key: gold_mambu_int
          depends_on:
            - task_key: silver_mambu_int
            - task_key: silver_mambu_con
            - task_key: silver_mambu_transformed
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_mambu_int_data_model.id}
            full_refresh: false
        - task_key: gold_mambu_fact_con
          depends_on:
            - task_key: gold_mambu_int
            - task_key: gold_mambu_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_mambu_fact_con_data_model.id}
            full_refresh: false
        - task_key: gold_mambu_fact_trial_balance
          depends_on:
            - task_key: gold_mambu_fact_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_mambu_fact_trial_balance_data_model.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_mambu_con:
      name: ${bundle.target}_dlt_bronze_mambu_con
      tags:
        source: 'mambu'
        class: 'con'
        workload-type: 'ingest'
        sub-workload-type: 'bronze'
        business-unit: 'data'
        sub-business-unit: 'engineering'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'mambu'
            class: 'con'
            workload-type: 'ingest'
            sub-workload-type: 'bronze'
            business-unit: 'data'
            sub-business-unit: 'engineering'

      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/mambu/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      schema: bronze_mambu_con
      catalog: ${bundle.target}_catalog
      event_log:
        name: dlt_bronze_mambu_con
        schema: event_log
        catalog: ${bundle.target}_logs         

    dlt_bronze_mambu_int:
