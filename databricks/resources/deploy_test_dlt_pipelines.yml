resources:
  jobs:
    run_test_dlt_pipelines:
      name: ${bundle.target}_job_run_test_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_test_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_test_con.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_test_con:
      name: ${bundle.target}_dlt_bronze_test_con
      tags:
        source: 'test'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'test'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_beta_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_beta_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/test/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        pipelines.dropInactiveTables: true
      target: bronze_test_con
      catalog: ${bundle.target}_catalog
