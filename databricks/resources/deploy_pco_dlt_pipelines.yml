resources:
  jobs:
    run_pco_dlt_pipelines:
      name: ${bundle.target}_job_run_pco_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_pco_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_pco_con.id}
            full_refresh: false
        - task_key: bronze_pco_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_pco_int.id}
            full_refresh: false
        - task_key: silver_pco_con
          depends_on:
            - task_key: bronze_pco_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_pco_con_data_model.id}
            full_refresh: false
        - task_key: silver_pco_int
          depends_on:
            - task_key: bronze_pco_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_pco_int_data_model.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_pco_con:
      name: ${bundle.target}_dlt_bronze_pco_con
      tags:
        source: 'pco'
        class: 'con'
      clusters:
        - label: default
          node_type_id: "Standard_F16s"
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'pco'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/pco/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_pco_con
      catalog: ${bundle.target}_catalog

    dlt_bronze_pco_int:
      name: ${bundle.target}_dlt_bronze_pco_int
      tags:
        source: 'pco'
        class: 'int'
      clusters:
        - label: default
          node_type_id: "Standard_F16s"
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'pco'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/pco/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_pco_int
      catalog: ${bundle.target}_catalog

    dlt_silver_pco_con_data_model:
      name: ${bundle.target}_dlt_silver_pco_con_data_model
      tags:
        source: 'pco'
        class: 'con'
      clusters:
        - label: default
          node_type_id: "Standard_F16s"
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'pco'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/pco_data_model/nb_dlt_update_silver_con_pco_py.py"
      configuration:
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: silver_con
      catalog: ${bundle.target}_catalog

    dlt_silver_pco_int_data_model:
      name: ${bundle.target}_dlt_silver_pco_int_data_model
      tags:
        source: 'pco'
        class: 'int'
      clusters:
        - label: default
          node_type_id: "Standard_F16s"
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'pco'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/pco_data_model/nb_dlt_update_silver_int_pco_py.py"
      configuration:
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: silver_int
      catalog: ${bundle.target}_catalog
