resources:
  sql_warehouses:
    powerbi_warehouse:
      name: power_bi_warehouse
      cluster_size: "2X-Small"
      enable_serverless_compute: true
      auto_stop_mins: 1
      min_num_clusters: 1
      max_num_clusters: 1
      permissions:
        - service_principal_name: "${var.service_principal_power_bi}"
          level: CAN_USE
      tags:
        custom_tags:
          - key: "workload-type"
            value: "data-extract"
          - key: "sub-workload-type"
            value: "power-bi"
    
    saphana_warehouse:
      name: sap_hana_warehouse
