resources:
  jobs:
    run_mambu_oct25_dlt_pipelines:
      name: ${bundle.target}_job_run_mambu_oct25_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_mambu_oct25_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_mambu_oct25_con.id}
            full_refresh: false
        - task_key: bronze_mambu_oct25_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_mambu_oct25_int.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_mambu_oct25_con:
      name: ${bundle.target}_dlt_bronze_mambu_oct25_con
      tags:
        source: 'mambu'
        class: 'con'
        workload-type: 'ingest'
        sub-workload-type: 'bronze'
        business-unit: 'data'
        sub-business-unit: 'engineering'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'mambu'
            class: 'con'
            workload-type: 'ingest'
            sub-workload-type: 'bronze'
            business-unit: 'data'
            sub-business-unit: 'engineering'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/mambu_oct25/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      schema: bronze_mambu_oct25_con
      channel: CURRENT
      catalog: ${bundle.target}_catalog

    dlt_bronze_mambu_oct25_int:
      name: ${bundle.target}_dlt_bronze_mambu_oct25_int
      tags:
        source: 'mambu'
        class: 'int'
        workload-type: 'ingest'
        sub-workload-type: 'bronze'
        business-unit: 'data'
        sub-business-unit: 'engineering'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'mambu'
            class: 'int'
            workload-type: 'ingest'
            sub-workload-type: 'bronze'
            business-unit: 'data'
            sub-business-unit: 'engineering'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/mambu_oct25/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      schema: bronze_mambu_oct25_int
      channel: CURRENT
      catalog: ${bundle.target}_catalog
