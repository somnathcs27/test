resources:
  jobs:
    run_spectra_dlt_pipelines:
      name: ${bundle.target}_job_run_spectra_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_spectra_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_spectra_con.id}
            full_refresh: false
        - task_key: bronze_spectra_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_spectra_int.id}
            full_refresh: false
        - task_key: silver_spectra_int
          depends_on:
            - task_key: bronze_spectra_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_spectra_int_data_model.id}
            full_refresh: false
        - task_key: silver_spectra_con
          depends_on:
            - task_key: bronze_spectra_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_silver_spectra_con_data_model.id}
            full_refresh: false
        - task_key: gold_spectra_int_dim
          depends_on:
            - task_key: silver_spectra_int
            - task_key: silver_spectra_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_spectra_int_data_model.id}
            full_refresh: false
        - task_key: gold_spectra_con_dim
          depends_on:
            - task_key: silver_spectra_con
            - task_key: silver_spectra_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_spectra_con_data_model.id}
            full_refresh: false
        - task_key: gold_spectra_int_fact
          depends_on:
            - task_key: gold_spectra_con_dim
            - task_key: gold_spectra_int_dim
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_gold_spectra_int_fact_data_model.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_spectra_con:
      name: ${bundle.target}_dlt_bronze_spectra_con
      tags:
        source: 'spectra'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'spectra'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_beta_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_beta_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/spectra/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_spectra_con
      catalog: ${bundle.target}_catalog

    dlt_bronze_spectra_int:
      name: ${bundle.target}_dlt_bronze_spectra_int
      tags:
        source: 'spectra'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'spectra'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_beta_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_beta_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/spectra/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_spectra_int
      catalog: ${bundle.target}_catalog

    dlt_silver_spectra_int_data_model:
      name: ${bundle.target}_dlt_silver_spectra_int_data_model
      tags:
        source: 'spectra'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'spectra'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_beta_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_beta_ver_underscore}.py"
        - notebook:
            path: "../src/silver_models/spectra_data_model/nb_dlt_update_silver_int_spectra_py.ipynb"
      configuration:
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: silver_int
      catalog: ${bundle.target}_catalog

    dlt_silver_spectra_con_data_model:
