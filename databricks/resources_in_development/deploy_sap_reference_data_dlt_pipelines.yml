resources:
  jobs:
    run_sap_reference_data_dlt_pipelines:
      name: ${bundle.target}_job_run_sap_reference_data_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_sap_reference_data_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_sap_reference_data_int.id}
            full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_sap_reference_data_int:
      name: ${bundle.target}_dlt_bronze_sap_reference_data_int
      tags:
        source: 'sap_reference_data'
        class: 'int'
      serverless: true
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_beta_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_beta_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/sap_reference_data/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      target: bronze_sap_reference_data_int
      catalog: ${bundle.target}_catalog