resources:
  jobs:
    run_experian_one_sandbox_2_dlt_pipelines:
      name: ${bundle.target}_job_run_experian_one_sandbox_2_dlt_pipelines
      webhook_notifications:
        on_failure:
          - id: ${var.job_failure_notification_destination_id}
      tasks:
        - task_key: bronze_experian_one_sandbox_2_int
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_experian_one_sandbox_2_int.id}
            full_refresh: false
        - task_key: bronze_experian_one_sandbox_2_con
          pipeline_task:
            pipeline_id: ${resources.pipelines.dlt_bronze_experian_one_sandbox_2_con.id}
            full_refresh: false
        # - task_key: silver_experian_one_sandbox_2_con
        #   depends_on:
        #     - task_key: bronze_experian_one_sandbox_2_con
        #   pipeline_task:
        #     pipeline_id: ${resources.pipelines.dlt_silver_experian_one_sandbox_2_con_data_model.id}
        #     full_refresh: false
        # - task_key: silver_experian_one_sandbox_2_int
        #   depends_on:
        #     - task_key: bronze_experian_one_sandbox_2_int
        #   pipeline_task:
        #     pipeline_id: ${resources.pipelines.dlt_silver_experian_one_sandbox_2_int_data_model.id}
        #     full_refresh: false
      queue:
        enabled: true

  pipelines:
    dlt_bronze_experian_one_sandbox_2_con:
      name: ${bundle.target}_dlt_bronze_experian_one_sandbox_2_con
      tags:
        source: 'experian_one_sandbox_2'
        class: 'con'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'experian_one_sandbox_2'
            class: 'con'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/experian_one_sandbox_2/nb_dlt_bronze_con_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      schema: bronze_experian_sandbox_2_con
      catalog: ${bundle.target}_catalog
      event_log:
        name: dlt_bronze_experian_one_sandbox_2_con
        schema: event_log
        catalog: ${bundle.target}_logs      

    dlt_bronze_experian_one_sandbox_2_int:
      name: ${bundle.target}_dlt_bronze_experian_one_sandbox_2_int
      tags:
        source: 'experian_one_sandbox_2'
        class: 'int'
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
          custom_tags:
            source: 'experian_one_sandbox_2'
            class: 'int'
      libraries:
        - notebook:
            path: "../src/includes/${var.common_libs_lts_ver_underscore}/${bundle.target}_include_mdp_databricks_common_${var.common_libs_lts_ver_underscore}.py"
        - notebook:
            path: "../src/bronze_merges/experian_one_sandbox_2/nb_dlt_bronze_int_data_model.py"
      configuration:
        environment_name: ${bundle.target}
        datalake_name_con: ${var.DATALAKE_NAME_CON}
        datalake_name_int: ${var.DATALAKE_NAME_INT}
        pipelines.dropInactiveTables: true
        pipelines.maxFlowRetryAttempts: 1
        pipelines.numUpdateRetryAttempts: 0
      schema: bronze_experian_sandbox_2_int
      catalog: ${bundle.target}_catalog
      event_log:
        name: dlt_bronze_experian_one_sandbox_2_int
        schema: event_log
        catalog: ${bundle.target}_logs       

